name: build-Windows

#on:
#  release:
#    types: [created]

on: [push]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  CONAN_LOCKFILE: wxwidgets-conan.lock
  CONAN_PROFILE: windows-x86_64-msvc194-release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python "3.12"
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install Conan
      run: |
        python -m pip install --upgrade pip
        pip install "conan>=2,<3"
        conan config install https://gitlab.com/terranum-conan/conan-profile.git

    - name: Cache Conan packages
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/conan-cache.tgz
        key: conan-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.CONAN_PROFILE }}-${{ hashFiles('conanfile.py', 'wxwidgets-conan.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          conan-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.CONAN_PROFILE }}-${{ hashFiles('conanfile.py', 'wxwidgets-conan.lock') }}-
          conan-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.CONAN_PROFILE }}-

    - name: Restore Conan packages
      shell: bash
      run: |
        if [ -f "${{ runner.temp }}/conan-cache.tgz" ]; then
          conan cache restore "${{ runner.temp }}/conan-cache.tgz"
        fi

    - name: Install Conan Libraries
      run: >
        conan install . --build=missing
        --lockfile=${{ env.CONAN_LOCKFILE }}
        -s build_type=${{ env.BUILD_TYPE }}
        -pr:h=${{ env.CONAN_PROFILE }}
        -pr:b=${{ env.CONAN_PROFILE }}

    - name: Save Conan packages
      run: conan cache save "*:*" --file="${{ runner.temp }}/conan-cache.tgz"

    - name: Build
      run: >
        conan build .
        --lockfile=${{ env.CONAN_LOCKFILE }}
        -s build_type=${{ env.BUILD_TYPE }}
        -pr:h=${{ env.CONAN_PROFILE }}
        -pr:b=${{ env.CONAN_PROFILE }}

